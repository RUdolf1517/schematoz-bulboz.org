{% extends "base.html" %}
{% block main_class %}main-feed{% endblock %}
{% block content %}
<div class="room-head" id="room-head" data-slug="{{ slug }}"></div>
<div class="tabs" id="feed-tabs">
  <button data-tab="hot" class="active">🔥 Горячее</button>
  <button data-tab="new">Новое</button>
  <button data-tab="unanswered">Без ответа</button>
</div>
<section class="feed" id="feed" tabindex="0" data-room="{{ slug }}"></section>
{% endblock %}
