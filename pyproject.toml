[project]
name = "schematoz-bulboz"
version = "0.1.0"
description = "schematoz-bulboz.org — Q&A нового поколения"
requires-python = ">=3.12"
dependencies = [
    "flask[async]>=3.0",
    "asgiref>=3.8",
    "hypercorn>=0.17",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "markdown>=3.6",
    "nh3>=0.2",
    "pillow>=10",
    "kremle-detect[flask] @ git+https://github.com/RUdolf1517/KremleXYZ-Detect.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1", "fakeredis>=2.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
